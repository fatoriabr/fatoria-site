<style>
  :root{
    --roxo-profundo:#4B2E83;
    --violeta-tech:#6A3FD9;
    --ouro:#C9A431;
    --ouro-claro:#D4AF37;
    --creme:#F2F0EB;
    --preto:#0F0F0F;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Manrope',sans-serif;
    background:radial-gradient(circle at 50% 0%, var(--roxo-profundo) 0%, var(--preto) 65%);
    color:var(--creme);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:48px 20px 40px;
  }
  .wrap{
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .logo{
    width:88px;
    height:88px;
    border-radius:50%;
    overflow:hidden;
    box-shadow:0 0 0 1px rgba(212,175,55,0.35), 0 12px 30px rgba(106,63,217,0.45);
    margin-bottom:18px;
  }
  .logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  h1{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.02em;
    text-align:center;
  }
  .tagline{
    font-size:13px;
    color:var(--ouro-claro);
    text-transform:uppercase;
    letter-spacing:0.12em;
    margin-top:6px;
    text-align:center;
  }
  .sub{
    font-size:14px;
    color:rgba(242,240,235,0.65);
    text-align:center;
    margin-top:14px;
    line-height:1.5;
    max-width:340px;
  }
  .links{
    width:100%;
    margin-top:34px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  a.btn{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 20px;
    border-radius:14px;
    text-decoration:none;
    font-family:'Sora',sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--creme);
    background:rgba(242,240,235,0.05);
    border:1px solid rgba(242,240,235,0.14);
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  a.btn:hover{
    transform:translateY(-2px);
    border-color:rgba(212,175,55,0.55);
    background:rgba(242,240,235,0.09);
  }
  a.btn.destaque{
    background:linear-gradient(135deg, var(--violeta-tech), var(--roxo-profundo));
    border:1px solid rgba(212,175,55,0.55);
    box-shadow:0 10px 26px rgba(106,63,217,0.35);
  }
  a.btn.destaque:hover{
    border-color:var(--ouro-claro);
  }
  .icon{
    width:22px;
    height:22px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
  }
  .label{flex:1;}
  .arrow{
    opacity:0.5;
    font-size:16px;
  }
  .socials{
    display:flex;
    gap:14px;
    margin-top:30px;
  }
  .socials a{
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(242,240,235,0.06);
    border:1px solid rgba(242,240,235,0.14);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--creme);
    text-decoration:none;
    transition:border-color .15s ease, transform .15s ease, background .15s ease;
  }
  .socials a svg{
    width:19px;
    height:19px;
    fill:var(--creme);
  }
  .socials a:hover{
    border-color:var(--ouro-claro);
    background:rgba(242,240,235,0.1);
    transform:translateY(-2px);
  }
  footer{
    margin-top:44px;
    text-align:center;
    font-size:11px;
    color:rgba(242,240,235,0.4);
    line-height:1.6;
  }
</style>
