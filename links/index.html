<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fator IA — Links</title>
<meta name="description" content="Fator IA — Inteligência Aplicada a Negócios. Acesse o site, fale no WhatsApp ou comece seu diagnóstico gratuito.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --roxo-profundo:#4B2E83;
    --violeta-tech:#6A3FD9;
    --ouro:#C9A431;
    --ouro-claro:#D4AF37;
    --creme:#F2F0EB;
    --preto:#0F0F0F;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100%;}
  body{
    font-family:'Manrope',sans-serif;
    background:radial-gradient(circle at 50% 0%, var(--roxo-profundo) 0%, var(--preto) 65%);
    color:var(--creme);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:56px 20px 40px;
  }
  .wrap{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    flex-shrink:0;
  }
  .logo-holder{
    position:relative;
    width:96px;
    height:96px;
    margin-bottom:22px;
    flex-shrink:0;
  }
  .logo-glow{
    position:absolute;
    inset:-18px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(212,175,55,0.35) 0%, rgba(106,63,217,0.25) 45%, transparent 72%);
    filter:blur(10px);
    z-index:0;
  }
  .logo{
    position:relative;
    width:96px;
    height:96px;
    border-radius:50%;
    padding:2px;
    background:conic-gradient(from 180deg, var(--ouro-claro), var(--violeta-tech), var(--ouro), var(--ouro-claro));
    z-index:1;
    box-shadow:0 14px 34px rgba(0,0,0,0.45);
  }
  .logo-inner{
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    background:var(--preto);
    position:relative;
  }
  .logo-inner img{
    position:absolute;
    top:50%;
    left:50%;
    width:122%;
    height:122%;
    transform:translate(-50%,-50%);
    object-fit:cover;
    display:block;
  }
  h1{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:23px;
    letter-spacing:0.01em;
    text-align:center;
  }
  .tagline{
    font-size:12px;
    color:var(--ouro-claro);
    text-transform:uppercase;
    letter-spacing:0.16em;
    margin-top:7px;
    text-align:center;
  }
  .sub{
    font-size:14px;
    color:rgba(242,240,235,0.6);
    text-align:center;
    margin-top:16px;
    line-height:1.55;
    max-width:320px;
  }
  .links{
    width:100%;
    margin-top:36px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  a.btn{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:17px 20px;
    border-radius:16px;
    text-decoration:none;
    font-family:'Sora',sans-serif;
    font-weight:600;
    font-size:14.5px;
    color:var(--creme);
    background:rgba(242,240,235,0.045);
    backdrop-filter:blur(6px);
    border:1px solid rgba(242,240,235,0.12);
    transition:transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    flex-shrink:0;
  }
  a.btn:hover{
    transform:translateY(-2px);
    border-color:rgba(212,175,55,0.5);
    background:rgba(242,240,235,0.08);
    box-shadow:0 10px 24px rgba(0,0,0,0.35);
  }
  a.btn.destaque{
    background:linear-gradient(135deg, var(--violeta-tech), var(--roxo-profundo));
    border:1px solid rgba(212,175,55,0.45);
    box-shadow:0 12px 28px rgba(106,63,217,0.4);
  }
  a.btn.destaque:hover{
    border-color:var(--ouro-claro);
  }
  .icon{
    width:20px;
    height:20px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
  }
  .label{flex:1;}
  .arrow{
    opacity:0.45;
    font-size:15px;
    transition:transform .18s ease, opacity .18s ease;
  }
  a.btn:hover .arrow{
    opacity:0.9;
    transform:translateX(2px);
  }
  .divider{
    width:40px;
    height:1px;
    background:rgba(242,240,235,0.15);
    margin:32px 0 26px;
  }
  .socials{
    display:flex;
    gap:12px;
    flex-shrink:0;
  }
  .socials a{
    width:42px;
    height:42px;
    border-radius:50%;
    background:rgba(242,240,235,0.05);
    border:1px solid rgba(242,240,235,0.12);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--creme);
    text-decoration:none;
    transition:border-color .18s ease, transform .18s ease, background .18s ease;
    flex-shrink:0;
  }
  .socials a svg{
    width:17px;
    height:17px;
    fill:var(--creme);
  }
  .socials a:hover{
    border-color:var(--ouro-claro);
    background:rgba(242,240,235,0.09);
    transform:translateY(-2px);
  }
  footer{
    margin-top:40px;
    text-align:center;
    font-size:10.5px;
    color:rgba(242,240,235,0.35);
    line-height:1.7;
    letter-spacing:0.02em;
    flex-shrink:0;
  }
</style>
</head>
