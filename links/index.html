<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fator IA — Links</title>
<meta name="description" content="Fator IA — Inteligência Aplicada a Negócios. Acesse o site, fale no WhatsApp ou comece seu diagnóstico gratuito.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --roxo-profundo:#4B2E83;
    --violeta-tech:#6A3FD9;
    --ouro:#C9A431;
    --ouro-claro:#D4AF37;
    --creme:#F2F0EB;
    --preto:#0F0F0F;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Manrope',sans-serif;
    background:radial-gradient(circle at 50% 0%, var(--roxo-profundo) 0%, var(--preto) 65%);
    color:var(--creme);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:48px 20px 40px;
  }
  .wrap{
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .logo{
    width:72px;
    height:72px;
    border-radius:18px;
    background:linear-gradient(135deg, var(--violeta-tech), var(--roxo-profundo));
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Sora',sans-serif;
    font-weight:800;
    font-size:26px;
    color:var(--creme);
    box-shadow:0 0 0 1px rgba(212,175,55,0.35), 0 12px 30px rgba(106,63,217,0.35);
    margin-bottom:18px;
  }
  h1{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.02em;
    text-align:center;
  }
  .tagline{
    font-size:13px;
    color:var(--ouro-claro);
    text-transform:uppercase;
    letter-spacing:0.12em;
    margin-top:6px;
    text-align:center;
  }
  .sub{
    font-size:14px;
    color:rgba(242,240,235,0.65);
    text-align:center;
    margin-top:14px;
    line-height:1.5;
    max-width:340px;
  }
  .links{
    width:100%;
    margin-top:34px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  a.btn{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 20px;
    border-radius:14px;
    text-decoration:none;
    font-family:'Sora',sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--creme);
    background:rgba(242,240,235,0.05);
    border:1px solid rgba(242,240,235,0.14);
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  a.btn:hover{
    transform:translateY(-2px);
    border-color:rgba(212,175,55,0.55);
    background:rgba(242,240,235,0.09);
  }
  a.btn.destaque{
    background:linear-gradient(135deg, var(--violeta-tech), var(--roxo-profundo));
    border:1px solid rgba(212,175,55,0.55);
    box-shadow:0 10px 26px rgba(106,63,217,0.35);
  }
  a.btn.destaque:hover{
    border-color:var(--ouro-claro);
  }
  .icon{
    width:22px;
    height:22px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
  }
  .label{flex:1;}
  .arrow{
    opacity:0.5;
    font-size:16px;
  }
  .socials{
    display:flex;
    gap:14px;
    margin-top:30px;
  }
  .socials a{
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(242,240,235,0.06);
    border:1px solid rgba(242,240,235,0.14);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--creme);
    text-decoration:none;
    font-size:18px;
    transition:border-color .15s ease, transform .15s ease;
  }
  .socials a:hover{
    border-color:var(--ouro-claro);
    transform:translateY(-2px);
  }
  footer{
    margin-top:44px;
    text-align:center;
    font-size:11px;
    color:rgba(242,240,235,0.4);
    line-height:1.6;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">FI</div>
    <h1>Fator IA</h1>
    <div class="tagline">Inteligência Aplicada a Negócios</div>
    <p class="sub">Organize. Automatize. Escale. Escolha por onde começar:</p>

    <div class="links">
      <a class="btn destaque" href="https://www.fatoriabr.com.br/?diagnostico=linktree">
        <span class="icon">⚡</span>
        <span class="label">Fazer meu diagnóstico gratuito</span>
        <span class="arrow">→</span>
      </a>

      <a class="btn" href="https://www.fatoriabr.com.br">
        <span class="icon">🌐</span>
        <span class="label">Conhecer o site da Fator IA</span>
        <span class="arrow">→</span>
      </a>

      <a class="btn" href="https://wa.me/5571983618484?text=Ol%C3%A1%2C%20vim%20pelo%20Instagram%20e%20quero%20saber%20mais%20sobre%20a%20Fator%20IA" target="_blank" rel="noopener">
        <span class="icon">💬</span>
        <span class="label">Falar no WhatsApp</span>
        <span class="arrow">→</span>
      </a>
    </div>

    <div class="socials">
      <a href="https://instagram.com/fator.ia.br" target="_blank" rel="noopener" aria-label="Instagram">IG</a>
      <a href="https://linkedin.com/company/fator-ia" target="_blank" rel="noopener" aria-label="LinkedIn">in</a>
    </div>

    <footer>
      © 2026 Fator IA — Inteligência Aplicada a Negócios<br>
      Salvador, Bahia — Brasil
    </footer>
  </div>
</body>
</html>
